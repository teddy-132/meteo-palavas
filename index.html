<title>Créneaux Mer Plate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ink: #1b2422;
    --ink-soft: #55625c;
    --ink-faint: #8b968f;
    --paper: #eef1ef;
    --surface: #ffffff;
    --surface-sunken: #e4e8e5;
    --line: #d4dad6;
    --line-strong: #b9c1bb;
    --accent: #2f6a5c;
    --accent-ink: #1d4a40;
    --accent-soft: #dfeeea;
    --accent-soft-line: #bcdcd2;
    --shadow: 0 2px 6px rgba(27,36,34,0.08), 0 10px 26px -14px rgba(27,36,34,0.22);
    --font-display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
    --c-green: #1f9e5a;
    --c-green-ink: #0d6b3c;
    --c-blue: #2f80c9;
    --c-blue-ink: #1c5f9e;
    --c-orange: #4a3f8c;
    --c-orange-ink: #2b2361;
    --c-grey: #8a9099;
    --c-grey-ink: #454a52;
    --c-high: #e2711d;
    --c-high-ink: #8a3d0d;
    --hero-a: #1d4a6e;
    --hero-b: #0e7a6c;
    --hero-c: #17a37e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e9efec; --ink-soft: #a7b3ac; --ink-faint: #6c7871;
      --paper: #10151a; --surface: #1a2128; --surface-sunken: #131920;
      --line: #2a333a; --line-strong: #3c4750;
      --accent: #6cb3a0; --accent-ink: #a9dccc; --accent-soft: #16302c; --accent-soft-line: #244a41;
      --shadow: 0 2px 6px rgba(0,0,0,0.35), 0 10px 26px -14px rgba(0,0,0,0.55);
      --c-green: #3fcd82; --c-green-ink: #bdf3d4;
      --c-blue: #5aa8e8; --c-blue-ink: #cfe6fb;
      --c-orange: #8478e0; --c-orange-ink: #e2defb;
      --c-grey: #9aa0a8; --c-grey-ink: #e5e8ec;
      --c-high: #ff9d4d; --c-high-ink: #ffe3c2;
      --hero-a: #0c2c44; --hero-b: #0a4a42; --hero-c: #0f6b53;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e9efec; --ink-soft: #a7b3ac; --ink-faint: #6c7871;
    --paper: #10151a; --surface: #1a2128; --surface-sunken: #131920;
    --line: #2a333a; --line-strong: #3c4750;
    --accent: #6cb3a0; --accent-ink: #a9dccc; --accent-soft: #16302c; --accent-soft-line: #244a41;
    --shadow: 0 2px 6px rgba(0,0,0,0.35), 0 10px 26px -14px rgba(0,0,0,0.55);
    --c-green: #3fcd82; --c-green-ink: #bdf3d4;
    --c-blue: #5aa8e8; --c-blue-ink: #cfe6fb;
    --c-orange: #8478e0; --c-orange-ink: #e2defb;
    --c-grey: #9aa0a8; --c-grey-ink: #e5e8ec;
    --c-high: #ff9d4d; --c-high-ink: #ffe3c2;
    --hero-a: #0c2c44; --hero-b: #0a4a42; --hero-c: #0f6b53;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--font-body); font-size: 14px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft-line); }
  button { font-family: inherit; font-size: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--c-blue); outline-offset: 2px; }

  .app { display: flex; flex-direction: column; min-height: 100vh; }

  header.top {
    position: relative; overflow: hidden;
    background: linear-gradient(120deg, var(--hero-a), var(--hero-b) 55%, var(--hero-c));
    padding: 26px 28px 22px; color: #fff;
    min-height: 260px; display: flex; align-items: flex-end;
  }
  .top-photo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; object-position: right center; z-index: 0;
    filter: drop-shadow(0 8px 22px rgba(0,0,0,0.35));
  }
  header.top::before {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(100deg, rgba(13,38,58,0.85) 0%, rgba(13,38,58,0.55) 24%, rgba(13,38,58,0) 46%),
      linear-gradient(0deg, rgba(9,20,28,0.5) 0%, rgba(9,20,28,0) 45%);
  }
  header.top::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 22px; z-index: 2;
    background:
      radial-gradient(circle at 10px 0, transparent 12px, var(--paper) 13px) 0 0/40px 100%,
      radial-gradient(circle at 30px 22px, transparent 12px, var(--paper) 13px) 0 0/40px 100%;
    opacity: 1;
  }
  .top-inner {
    position: relative; z-index: 2; width: 100%;
  }
  .top-text { min-width: 0; }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand h1 {
    font-family: var(--font-display); font-weight: 800; font-size: 34px;
    letter-spacing: 0.3px; margin: 0; text-wrap: balance;
  }
  .brand .org {
    font-family: var(--font-mono); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; color: rgba(255,255,255,0.78);
    border-left: 1px solid rgba(255,255,255,0.4); padding-left: 12px;
  }
  .subtitle { margin: 6px 0 0; color: rgba(255,255,255,0.88); font-size: 13px; max-width: 58ch; position: relative; z-index: 1; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; position: relative; z-index: 1; }
  .stat {
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.28); border-radius: 8px;
    padding: 8px 14px; min-width: 112px; backdrop-filter: blur(2px);
  }
  .stat .n {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: 19px; font-weight: 600; line-height: 1.2; color: #fff;
  }
  .stat .l {
    display: block; margin-top: 3px; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.07em; color: rgba(255,255,255,0.78);
  }

  .legend {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    padding: 14px 28px 6px; font-size: 12px; color: var(--ink-soft);
  }
  .legend .hint { font-size: 11px; color: var(--ink-faint); }
  .legend .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 6px; border-radius: 999px; font-weight: 600; font-size: 11.5px;
    border: 1.5px solid transparent; cursor: pointer; -webkit-appearance: none; appearance: none;
    transition: background 0.12s ease, border-color 0.12s ease, opacity 0.12s ease, transform 0.06s ease;
  }
  .legend .pill:hover { transform: translateY(-1px); }
  .legend .pill:active { transform: translateY(0); }
  .legend .pill i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .legend .pill.green { background: color-mix(in srgb, var(--c-green) 16%, transparent); color: var(--c-green-ink); border-color: color-mix(in srgb, var(--c-green) 45%, transparent); }
  .legend .pill.green i { background: var(--c-green); }
  .legend .pill.blue { background: color-mix(in srgb, var(--c-blue) 16%, transparent); color: var(--c-blue-ink); border-color: color-mix(in srgb, var(--c-blue) 45%, transparent); }
  .legend .pill.blue i { background: var(--c-blue); }
  .legend .pill.orange { background: color-mix(in srgb, var(--c-orange) 18%, transparent); color: var(--c-orange-ink); border-color: color-mix(in srgb, var(--c-orange) 45%, transparent); }
  .legend .pill.orange i { background: var(--c-orange); }
  .legend .pill.high { background: color-mix(in srgb, var(--c-high) 18%, transparent); color: var(--c-high-ink); border-color: color-mix(in srgb, var(--c-high) 45%, transparent); }
  .legend .pill.high i { background: var(--c-high); }
  .legend .pill:not(.active) { background: transparent; opacity: 0.5; }
  .legend .pill:not(.active) i { background: transparent; border: 2px solid currentColor; }

  .content { flex: 1; padding: 8px 28px 32px; display: flex; flex-direction: column; gap: 22px; }

  .day-block { display: flex; flex-direction: column; gap: 10px; }
  .day-heading {
    font-family: var(--font-display); font-weight: 700; font-size: 17px;
    letter-spacing: 0.02em; color: var(--ink); margin: 0;
    display: flex; align-items: baseline; gap: 8px;
  }
  .day-heading .rel { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; }

  .tiles { display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .tile {
    --tc: var(--c-blue); --ti: var(--c-blue-ink);
    flex: 0 0 auto;
    text-decoration: none; cursor: pointer;
    width: 170px; border-radius: 8px; padding: 5px 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(160deg, color-mix(in srgb, var(--tc) 46%, transparent), color-mix(in srgb, var(--tc) 32%, transparent));
    border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent);
    color: var(--ti); box-shadow: var(--shadow);
    transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease, border-color 0.16s ease, filter 0.16s ease;
  }
  .tile:hover, .tile:focus-visible {
    transform: scale(1.1);
    background: linear-gradient(160deg, color-mix(in srgb, var(--tc) 84%, transparent), color-mix(in srgb, var(--tc) 68%, transparent));
    border-color: color-mix(in srgb, var(--tc) 90%, transparent);
    box-shadow: 0 6px 16px -6px rgba(0,0,0,0.3), 0 0 12px 2px color-mix(in srgb, var(--tc) 55%, transparent);
    filter: brightness(1.05);
    position: relative; z-index: 3;
  }
  .tile.band-green { --tc: var(--c-green); --ti: var(--c-green-ink); }
  .tile.band-blue { --tc: var(--c-blue); --ti: var(--c-blue-ink); }
  .tile.band-orange { --tc: var(--c-orange); --ti: var(--c-orange-ink); }
  .tile.band-high { --tc: var(--c-high); --ti: var(--c-high-ink); }
  .tile.band-grey { --tc: var(--c-grey); --ti: var(--c-grey-ink); }
  .tile .ok {
    font-family: var(--font-display); font-weight: 800; font-size: 12.5px; letter-spacing: 0.02em;
  }
  .tile .range { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .tile .h { font-family: var(--font-mono); font-size: 8px; margin-top: 3px; font-weight: 600; }
  .tile.is-now { outline: 2px solid var(--ti); outline-offset: 2px; }
  .tile.tile-wide { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  .empty-board {
    border: 1.5px dashed var(--line-strong); border-radius: 10px; padding: 22px 20px;
    color: var(--ink-soft); font-size: 13px; background: var(--surface-sunken); max-width: 62ch;
  }
  .empty-board strong { color: var(--ink); }

  .note {
    border-top: 1px solid var(--line); padding-top: 14px; font-size: 12px; color: var(--ink-faint);
    display: flex; flex-direction: column; gap: 4px;
  }
  .note b { color: var(--ink-soft); }

  @media (max-width: 720px) {
    header.top { padding: 20px 16px 20px; min-height: 230px; }
    .legend { padding: 12px 16px 4px; }
    .content { padding: 6px 16px 24px; }
    .tile { width: 138px; padding: 4px 3px; }
    .tiles { gap: 3px; }
    .tile .ok { font-size: 11px; }
    .tile .range { font-size: 16px; }
    .tile .h { font-size: 7.5px; }
  }
</style>

    }
    if (!tiles.length) {
      content.innerHTML = '<div class="empty-board"><strong>Toutes les couleurs sont masquées.</strong> Cliquez sur un ovale ci-dessus (vert, bleu, orange ou orange vif) pour réafficher ses briques.</div>';
      return;
    }
    var now = new Date();
    var byDay = {};
    var order = [];
    tiles.forEach(function (t) {
      var key = t.s.toDateString();
      if (!byDay[key]) { byDay[key] = []; order.push(key); }
      byDay[key].push(t);
    });
    order.forEach(function (key) {
      var group = byDay[key];
      var block = document.createElement("div");
      block.className = "day-block";
      var heading = document.createElement("p");
      heading.className = "day-heading";
      var isToday = key === now.toDateString();
      heading.innerHTML = fmtDateFR(group[0].s) + (isToday ? ' <span class="rel">aujourd\'hui</span>' : "");
      block.appendChild(heading);
      var row = document.createElement("div");
      row.className = "tiles";
      mergeConsecutive(group).forEach(function (t) {
        var tile = document.createElement("a");
        var isNow = t.s <= now && now < t.e;
        tile.className = "tile band-" + t.band + (isNow ? " is-now" : "") + (t.count > 1 ? " tile-wide" : "");
        tile.href = SEA_SOURCE_URL;
        tile.target = "_blank";
        tile.rel = "noopener noreferrer";
        tile.title = "Source : bulletin Météo Consult Marine (marina-281)";
        var durH = Math.round((t.e.getTime() - t.s.getTime()) / 3600000);
        tile.innerHTML =
          '<div class="range">' + fmtTimeFR(t.s) + '–' + fmtTimeFR(t.e) + '</div>' +
          '<div class="h">' + t.h.toFixed(1).replace(".", ",") + ' m' + (t.count > 1 ? ' · ' + durH + 'h' : '') + '</div>';
        row.appendChild(tile);
      });
      BROADCASTS.forEach(function (b) {
        var bd = new Date(b.time);
        if (bd.toDateString() !== key) return;
        var tile = document.createElement("a");
        tile.className = "tile band-grey";
        tile.href = b.url;
        tile.target = "_blank";
        tile.rel = "noopener noreferrer";
        tile.title = "Source : " + b.url;
        tile.innerHTML =
          '<div class="ok">' + b.emoji + ' ' + b.label + '</div>' +
          '<div class="range">' + (b.rangeOverride || fmtTimeFR(bd)) + '</div>' +
          '<div class="h">' + b.sub + '</div>';
        row.appendChild(tile);
      });
      block.appendChild(row);
      content.appendChild(block);
    });

    BROADCASTS.forEach(function (b) {
      var bd = new Date(b.time);
      var bKey = bd.toDateString();
      if (byDay[bKey]) return;
      var block = document.createElement("div");
      block.className = "day-block";
      var heading = document.createElement("p");
      heading.className = "day-heading";
      heading.innerHTML = fmtDateFR(bd);
      block.appendChild(heading);
      var row = document.createElement("div");
      row.className = "tiles";
      var tile = document.createElement("a");
      tile.className = "tile band-grey";
      tile.href = b.url;
      tile.target = "_blank";
      tile.rel = "noopener noreferrer";
      tile.title = "Source : " + b.url;
      tile.innerHTML =
        '<div class="ok">' + b.emoji + ' ' + b.label + '</div>' +
        '<div class="range">' + (b.rangeOverride || fmtTimeFR(bd)) + '</div>' +
        '<div class="h">' + b.sub + '</div>';
      row.appendChild(tile);
      block.appendChild(row);
      content.appendChild(block);
    });

    var note = document.createElement("div");
    note.className = "note";
    note.innerHTML =
      '<span><b>Source :</b> bulletin détaillé Météo Consult Marine, Port de Palavas-les-Flots, zone côtière (jamais la valeur « au large ») — relevé toutes les 2&nbsp;heures.</span>' +
      '<span><b>Précision :</b> hauteur de mer totale heure par heure telle que publiée par Météo Consult, sans filtrage — toutes les heures sont affichées (vert ≤ 0 m, bleu ≤ 0,1 m, orange ≤ 0,2 m, orange vif ≥ 0,3 m) ; à traiter comme indicatif et à recouper avec le bulletin avant une sortie.</span>' +
      '<span><b>Dernière analyse :</b> ' + fmtDateTimeFR(new Date(LAST_UPDATE)) + ' — prochaine vérification vers ' + fmtDateTimeFR(new Date(NEXT_CHECK)) + '.</span>' +
      '<span><b>📺 Sport :</b> MXGP (Automoto la chaîne), F1 et MotoGP (Canal+, horaires vérifiés sur canalplus.com), VTT descente Coupe du monde UCI (Eurosport / La Chaîne L\'Équipe) — cliquez une brique grise pour ouvrir sa source. Horaires à confirmer près de la date, notamment pour Whistler.</span>' +
      '<span><b>Cliquer une brique :</b> chaque brique (mer ou TV) ouvre dans un nouvel onglet la page utilisée comme source de son information.</span>';
    content.appendChild(note);
  }

  function renderAll() {
    renderStats();
    renderContent();
  }

  document.getElementById("legend").addEventListener("click", function (e) {
    var btn = e.target.closest(".pill");
    if (!btn) return;
    var band = btn.dataset.band;
    activeBands[band] = !activeBands[band];
    btn.classList.toggle("active", activeBands[band]);
    renderAll();
  });

  renderAll();
})();
</script>

</body></html>
