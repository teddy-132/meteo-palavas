yaml
name: Rafraîchir Créneaux Mer Plate

on:
  schedule:
    - cron: "15 */2 * * *"   # toutes les 2h, à 15 min (heure UTC)
  workflow_dispatch: {}       # bouton "Run workflow" pour tester manuellement

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les hauteurs de mer (Open-Meteo) et mettre à jour la page
        run: python3 update_tiles.py

      - name: Publier si les données ont changé
        run: |
          git config user.name "creneaux-mer-plate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
          else
            git commit -m "Rafraîchissement automatique des données de mer"
            git push
          fi
